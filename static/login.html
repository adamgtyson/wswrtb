<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · WSWRTB</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <span class="brand">WSWRTB</span>
      <button id="theme-toggle" class="ghost" type="button">Theme</button>
    </header>

    <h1>Welcome back</h1>
    <p class="subtitle">Log in to view and edit your reading preferences.</p>

    <form id="login-form" class="card" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" />

      <button class="primary" type="submit">Log in</button>
      <div id="msg" class="msg"></div>
    </form>

    <p class="foot">Have an invite code? <a href="/signup">Create an account</a></p>
  </div>
  <script src="/static/js/login.js"></script>
</body>
</html>
