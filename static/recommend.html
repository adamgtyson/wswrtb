<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask for a book · WSWRTB</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <span class="brand">WSWRTB</span>
      <div>
        <a class="navlink" href="/profile">Profile</a>
        <a class="navlink" href="/group">Group</a>
        <button id="theme-toggle" class="ghost" type="button">Theme</button>
        <button id="logout" class="ghost" type="button">Log out</button>
      </div>
    </header>

    <h1 id="group-name">Ask for a book</h1>
    <p class="subtitle">
      Pick who's reading, describe what you're after, and get five suggestions.
    </p>

    <!-- Shown only when the user belongs to more than one group. -->
    <div id="group-picker-wrap" class="hidden">
      <label for="group-picker">Group</label>
      <select id="group-picker"></select>
    </div>

    <div id="page-msg" class="msg"></div>

    <section class="card">
      <h2 class="section-title" style="margin-top:0;">Who's reading?</h2>
      <div id="member-checks"></div>

      <form id="ask-form" novalidate>
        <label for="prompt">What are you in the mood for?</label>
        <textarea
          id="prompt"
          maxlength="1000"
          placeholder="e.g. A twisty mystery set somewhere cold, nothing too long"
        ></textarea>
        <button class="primary" id="ask-btn" type="submit">Get recommendations</button>
      </form>
    </section>

    <!-- Past searches. Collapsed by default; opening one replays its stored results
         without spending another AI call. -->
    <section class="card hidden" id="recent-card">
      <div class="panel-head">
        <h2 class="section-title" style="margin-top:0;">Recent</h2>
        <button
          id="recent-toggle"
          class="ghost small"
          type="button"
          aria-expanded="false"
          aria-controls="recent-list"
        >Show</button>
      </div>
      <ul class="list hidden" id="recent-list"></ul>
    </section>

    <section class="card hidden" id="results-card">
      <!-- Shown only for a replayed set. A saved result set looks identical to a fresh
           one, so this banner and its date are what stop a member mistaking one for
           the other. -->
      <div class="replay-banner hidden" id="replay-banner">
        <span id="replay-text"></span>
        <button id="ask-again" class="ghost small" type="button">Ask again</button>
      </div>

      <h2 class="section-title" id="results-title" style="margin-top:0;">Recommendations</h2>
      <div class="books" id="results"></div>
    </section>
  </div>

  <script src="/static/js/recommend.js"></script>
</body>
</html>
